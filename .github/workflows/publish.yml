name: Publish

# Pushing a tag `vX.Y.Z` publishes that version to Maven Central. The tag must match
# VERSION_NAME in gradle.properties, or the workflow refuses rather than publishing something
# under the wrong name. The secrets are described in docs/publishing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag matches VERSION_NAME
        run: |
          expected="VERSION_NAME=${GITHUB_REF_NAME#v}"
          if ! grep -qx "$expected" gradle.properties; then
            echo "tag $GITHUB_REF_NAME does not match gradle.properties:"
            grep VERSION_NAME gradle.properties
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Test
        run: ./gradlew :liquidglass:allTests --stacktrace

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
