# Publishing. The coordinates and the POM live here, read by the maven-publish plugin, so a
# release is a change to VERSION_NAME and nothing else. Credentials never go in this file: they
# come from ~/.gradle/gradle.properties or ORG_GRADLE_PROJECT_* environment variables. See
# docs/publishing.md.
GROUP=com.wexpa.liquidglass
POM_ARTIFACT_ID=liquidglass
VERSION_NAME=0.1.0

POM_NAME=liquidglass
POM_DESCRIPTION=A refracting glass material for Compose Multiplatform, drawn entirely in a shader. Signed distance geometry, exact Snell refraction, dispersion and rim lighting; one modifier converts any composable.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/shayann07/liquidglass

