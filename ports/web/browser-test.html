<!doctype html><html lang="en"><meta charset="utf-8"><title>LiquidGlass renderer verification</title><canvas id="glass"></canvas><pre id="result">RUNNING</pre>
<script type="module">
import {createGlassRenderer} from './liquidglass.mjs';
const result=document.querySelector('#result'),canvas=document.querySelector('#glass');
try {
 const source=document.createElement('canvas');source.width=224;source.height=224;
 const context=source.getContext('2d'),data=context.createImageData(224,224);
 for(let y=0;y<224;y++)for(let x=0;x<224;x++){let i=(y*224+x)*4;data.data.set([x,y,64,255],i);}
 context.putImageData(data,0,0);
 const renderer=createGlassRenderer(canvas);renderer.setSource(source);
 const frame={width:224,height:224,x:112,y:112,radius:80,magnification:1.25};renderer.render(frame);
 const gl=canvas.getContext('webgl'),pixels=new Uint8Array(224*224*4);gl.readPixels(0,0,224,224,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 const pixel=(x,y,channel=0)=>pixels[((223-y)*224+x)*4+channel];
 const check=(condition,message)=>{if(!condition)throw Error(message);};
 check(Math.abs(pixel(10,20)-10)<=1 && Math.abs(pixel(10,20,1)-20)<=1,'source orientation/color mismatch');
 const gain=(pixel(117,112)-pixel(107,112))/10;check(gain>=.7&&gain<=.9,'centre magnification mismatch: '+gain);
 for(let x=40;x<184;x++){const delta=pixel(x+1,112)-pixel(x,112);check(delta>=-1&&delta<=3,'internal split rim at '+x+': '+delta);}
 let threw=false;try{renderer.render({...frame,magnification:NaN});}catch{threw=true;}check(threw,'invalid frame accepted');
 renderer.render({...frame,width:112,height:112,x:56,y:56,radius:40,pixelRatio:2});check(canvas.width===224,'DPI resize failed');
 const extension=gl.getExtension('WEBGL_lose_context');
 if(extension){
   const lost=new Promise(resolve=>canvas.addEventListener('webglcontextlost',resolve,{once:true}));extension.loseContext();await lost;
   check(renderer.render(frame)===false,'lost context rendered');
   const restored=new Promise(resolve=>canvas.addEventListener('webglcontextrestored',resolve,{once:true}));extension.restoreContext();
   await Promise.race([restored,new Promise((_,reject)=>setTimeout(()=>reject(Error('restore timeout')),4000))]);
   check(renderer.render(frame)===true,'restored context failed');
 }
 renderer.dispose();renderer.dispose();threw=false;try{renderer.render(frame);}catch{threw=true;}check(threw,'disposed renderer still rendered');
 result.textContent='PASS: real WebGL shader; ramp continuity; centre zoom; source orientation; DPI resize; invalid input; context loss/restore; disposal';
}catch(error){result.textContent='FAIL: '+error.stack;}
</script></html>
